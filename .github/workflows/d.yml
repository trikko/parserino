# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Build & Test

on:
  push:
    branches: [ master, pure-d ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        dc: [ldc-latest, dmd-latest]
        exclude:
        - os: macos-14
          dc: dmd-latest
        - os: macos-13
          dc: ldc-latest
    
    runs-on: ${{ matrix.os }}
  
    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@v1
      with:
          compiler: ${{ matrix.dc }}
          
    - name: 'Build & Test'
      run: |
        # Build the project, with its main file included, without unittests
        dub build
        # Build and run tests, as defined by `unittest` configuration
        # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
        # See https://dub.pm/package-format-json.html#configurations
        dub test

  # The oracles of tools/: reference dump, lazy parsing, snapshots, WPT tree construction and
  # html5lib tokenizer tests, parse errors, the betterC core (see tools/check.sh)
  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@v1
      with:
          compiler: ldc-latest
    - uses: actions/cache@v4
      with:
          path: |
            tools/corpus/files
            tools/corpus/wpt
            tools/corpus/html5lib-tests
          key: corpus-${{ hashFiles('tools/corpus/fetch.sh', 'tools/corpus/pages.txt', 'tools/corpus/extract_dat.py') }}
    - name: 'Corpus (pinned commits and web.archive.org snapshots)'
      run: tools/corpus/fetch.sh
    - name: 'Dump, lazy parsing, snapshots, conformance, betterC'
      run: tools/check.sh
